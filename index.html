    <script>
      // Tema antes del primer pintado para evitar destello (ver src/ui/theme.ts).
      // Migra los valores antiguos ("neon" → "tinta", "claro" → "papel").
      try {
        var t = localStorage.getItem('pt:theme');
        if (t === 'neon') { t = 'tinta'; localStorage.setItem('pt:theme', 'tinta'); }
        else if (t === 'claro') { t = 'papel'; localStorage.setItem('pt:theme', 'papel'); }
        if (t === 'tinta') document.documentElement.dataset.theme = 'tinta';
      } catch (e) {}
    </script>
